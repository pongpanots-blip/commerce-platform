# Build + push (ECR) + deploy (EC2) for commerce-platform / commerce-admin / commerce-portal.
# Mirrors the josh monorepo's "Deploy ECR → EC2" pattern.
#
# Tag → deploy target:
#   v1.2.3          → all 3 services
#   platform-v1.2.3 → commerce-platform only
#   admin-v1.2.3    → commerce-admin only
#   portal-v1.2.3   → commerce-portal only
#
# Runner: self-hosted on EC2 (labels: self-hosted, linux, commerce-platform)
#   Setup: docker/github-runner-setup.sh
#
# GitHub Secrets required:
#   Build/push ECR: AWS_ROLE_ARN (OIDC) or ECR_AWS_ACCESS_KEY_ID + ECR_AWS_SECRET_ACCESS_KEY
#   EC2:            EC2_HOST, EC2_USER, EC2_SSH_KEY, EC2_DEPLOY_DIR
#   App env (written to .env on EC2 by the deploy step): COMMERCE_DB_HOST, COMMERCE_DB_USERNAME,
#     COMMERCE_DB_PASSWORD, COMMERCE_DB_NAME, REDIS_HOST, STOREFRONT_API_KEYS, PORTAL_JWT_SECRET,
#     COMMERCE_CORS_ORIGINS, JOSH_DATABASE_URL, JOSH_MONGO_URL (optional, read-only josh DB users)
#   Jagota gateway (optional): vars JAGOTA_GATEWAY_ENABLED, JAGOTA_NODEAPI_BASE_URL;
#     secrets JAGOTA_NODEAPI_USERNAME, JAGOTA_NODEAPI_PASSWORD
#   Media + intake (optional; unset = upload 503 / intake 401): secrets AWS_ACCESS_KEY_ID,
#     AWS_SECRET_ACCESS_KEY, WINBACK_INTAKE_KEY. Bucket / region / base URL go in vars PLATFORM_FLAGS
#     (S3_MEDIA_BUCKET, AWS_REGION, MEDIA_BASE_URL) — not these secrets.
#
# ECR repos (create once): <account>.dkr.ecr.<region>.amazonaws.com/commerce-platform,
#   commerce-admin, commerce-portal
#
# First time: Actions → Run workflow → deploy_service=all, skip_deploy=true (test push only),
#   then run again with skip_deploy=false.

name: Deploy ECR → EC2

on:
  push:
    tags:
      - 'v*'
      - '*-v*'
  workflow_dispatch:
    inputs:
      deploy_service:
        description: 'all or a single service'
        required: true
        type: choice
        options:
          - all
          - platform
          - admin
          - portal
      image_tag:
        description: 'Image tag (default = git SHA)'
        required: false
        type: string
      application_commit:
        description: 'Optional full commit SHA for the application build, separate from deployment helpers'
        required: false
        type: string
      skip_deploy:
        description: 'Build & push only (skip EC2)'
        required: false
        type: boolean
        default: false
      skip_cleanup:
        description: 'Preserve all EC2 images, stopped containers and build caches'
        required: false
        type: boolean
        default: false
      expected_admin_tag:
        description: 'With skip_cleanup: stop before host writes if the current admin tag changed'
        required: false
        type: string

concurrency:
  group: deploy-ecr
  cancel-in-progress: false

# id-token: AWS_ROLE_ARN (GitHub OIDC → IAM role commerce-platform-github-ecr), no long-lived AWS keys.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.resolve.outputs.services }}
      tag: ${{ steps.resolve.outputs.tag }}
      application_commit: ${{ steps.resolve.outputs.application_commit }}
    steps:
      - id: resolve
        env:
          APPLICATION_COMMIT: ${{ inputs.application_commit }}
        run: |
          SOURCE_COMMIT="${APPLICATION_COMMIT:-$GITHUB_SHA}"
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo 'application_commit must be a full commit SHA'; exit 1; }
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${GITHUB_REF#refs/tags/}"
            case "$REF" in
              platform-v*) SERVICES='["platform"]' ;;
              admin-v*)    SERVICES='["admin"]' ;;
              portal-v*)   SERVICES='["portal"]' ;;
              v*)          SERVICES='["platform","admin","portal"]' ;;
              *) echo "unrecognized tag: $REF"; exit 1 ;;
            esac
            TAG="$REF"
          else
            case "${{ inputs.deploy_service }}" in
              all) SERVICES='["platform","admin","portal"]' ;;
              *)   SERVICES='["${{ inputs.deploy_service }}"]' ;;
            esac
            TAG="${{ inputs.image_tag }}"
            [ -z "$TAG" ] && TAG="${GITHUB_SHA::7}"
          fi
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "application_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Check out migration guard
        uses: actions/checkout@v4
      - name: Test migration guard
        run: node --test scripts/test/platform-migration-scope.test.cjs

  build-push:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.resolve.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.application_commit }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      # EC2 is Graviton → arm64 image. npm ci/nx build run natively (--platform=$BUILDPLATFORM stages);
      # QEMU only runs the small final stage (apk add, copy).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          platforms: linux/arm64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/commerce-${{ matrix.service }}:${{ needs.resolve.outputs.tag }}

  deploy:
    if: ${{ github.event_name == 'push' || inputs.skip_deploy != true }}
    needs: [resolve, build-push]
    runs-on: [self-hosted, linux, commerce-platform]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker
      - name: Verify existing target and rollback images
        if: inputs.skip_cleanup == true
        env:
          DEPLOY_DIR: ${{ secrets.EC2_DEPLOY_DIR }}
          EXPECTED_ADMIN_TAG: ${{ inputs.expected_admin_tag }}
        run: bash docker/deploy-preflight.sh "$DEPLOY_DIR/docker"
      - name: Verify approved pending migrations before host changes
        if: contains(fromJson(needs.resolve.outputs.services), 'platform')
        env:
          DEPLOY_DIR: ${{ secrets.EC2_DEPLOY_DIR }}
          MIGRATION_SCOPE_COMMIT: ${{ needs.resolve.outputs.application_commit }}
          MIGRATION_SCOPE_IMAGE_TAG: ${{ needs.resolve.outputs.tag }}
        run: bash docker/platform-migration-scope.sh preflight "$DEPLOY_DIR/docker"
      # Keep the EC2's compose/nginx/scripts in step with the repo (certbot/ certs live only on the box).
      - name: Sync docker/ files to the deploy dir
        run: |
          D="${{ secrets.EC2_DEPLOY_DIR }}/docker"
          mkdir -p "$D/nginx"
          cp docker/docker-compose.prod.yml docker/ec2-deploy.sh docker/ssl-init.sh docker/github-runner-setup.sh "$D/"
          cp docker/platform-migration-scope.sh docker/platform-migration-scope.cjs docker/platform-migration-policy.json "$D/"
          cp docker/platform-api-availability.cjs "$D/"
          cp docker/nginx/commerce-proxy.conf "$D/nginx/"
      - name: Pull + restart on this EC2
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SERVICES: ${{ needs.resolve.outputs.services }}
          MIGRATION_SCOPE_COMMIT: ${{ needs.resolve.outputs.application_commit }}
          MIGRATION_SCOPE_IMAGE_TAG: ${{ needs.resolve.outputs.tag }}
          SKIP_CLEANUP: ${{ inputs.skip_cleanup == true }}
          COMMERCE_DB_HOST: ${{ secrets.COMMERCE_DB_HOST }}
          COMMERCE_DB_USERNAME: ${{ secrets.COMMERCE_DB_USERNAME }}
          COMMERCE_DB_PASSWORD: ${{ secrets.COMMERCE_DB_PASSWORD }}
          COMMERCE_DB_NAME: ${{ secrets.COMMERCE_DB_NAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          STOREFRONT_API_KEYS: ${{ secrets.STOREFRONT_API_KEYS }}
          PORTAL_JWT_SECRET: ${{ secrets.PORTAL_JWT_SECRET }}
          COMMERCE_CORS_ORIGINS: ${{ secrets.COMMERCE_CORS_ORIGINS }}
          JOSH_DATABASE_URL: ${{ secrets.JOSH_DATABASE_URL }}
          JOSH_MONGO_URL: ${{ secrets.JOSH_MONGO_URL }}
          JOSH_MONGO_DB: ${{ secrets.JOSH_MONGO_DB }}
          JOSH_API_URL: ${{ secrets.JOSH_API_URL }}
          JOSH_EVENTS_SECRET: ${{ secrets.JOSH_EVENTS_SECRET }}
          JOSH_JWT_SECRET: ${{ secrets.JOSH_JWT_SECRET }}
          # Josh → commerce → Jagota ERP. Off unless the repo variable JAGOTA_GATEWAY_ENABLED=true.
          JAGOTA_GATEWAY_ENABLED: ${{ vars.JAGOTA_GATEWAY_ENABLED }}
          JAGOTA_NODEAPI_BASE_URL: ${{ vars.JAGOTA_NODEAPI_BASE_URL }}
          JAGOTA_NODEAPI_USERNAME: ${{ secrets.JAGOTA_NODEAPI_USERNAME }}
          JAGOTA_NODEAPI_PASSWORD: ${{ secrets.JAGOTA_NODEAPI_PASSWORD }}
          # Stage 1 cutover flags (repo variables; unset = compose defaults).
          CRON_COMPETITOR_PRICES_REFRESH_ENABLED: ${{ vars.CRON_COMPETITOR_PRICES_REFRESH_ENABLED }}
          CRON_MARKETING_RESEARCH_ENABLED: ${{ vars.CRON_MARKETING_RESEARCH_ENABLED }}
          RESEARCH_FREE_WORKER_ENABLED: ${{ vars.RESEARCH_FREE_WORKER_ENABLED }}
          SCRAPING_CRON_DISABLED: ${{ vars.SCRAPING_CRON_DISABLED }}
          PLATFORM_FLAGS: ${{ vars.PLATFORM_FLAGS }}
          # Media uploads + external winback intake. Unset = 503 / 401. Not PLATFORM_FLAGS (that file refuses secrets).
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          WINBACK_INTAKE_KEY: ${{ secrets.WINBACK_INTAKE_KEY }}
        run: |
          cd "${{ secrets.EC2_DEPLOY_DIR }}/docker"
          # Persist the env for manual compose commands on the box (ssl-init.sh, logs, exec). Compose reads
          # ./.env itself; image tags (*_TAG) are kept by ec2-deploy.sh, so preserve those lines.
          umask 077
          # Guarded platform releases retain the authorized running connection and flags.
          # No repository-variable access or environment/ownership changes are required.
          if [[ "$SERVICES" != *'"platform"'* ]]; then
          { grep -E '^[A-Z]+_TAG=' .env 2>/dev/null || true
            for v in ECR_REGISTRY COMMERCE_DB_HOST COMMERCE_DB_USERNAME COMMERCE_DB_PASSWORD COMMERCE_DB_NAME REDIS_HOST \
                     STOREFRONT_API_KEYS PORTAL_JWT_SECRET COMMERCE_CORS_ORIGINS JOSH_DATABASE_URL JOSH_MONGO_URL \
                     JOSH_MONGO_DB JOSH_API_URL JOSH_EVENTS_SECRET JOSH_JWT_SECRET \
                     JAGOTA_GATEWAY_ENABLED JAGOTA_NODEAPI_BASE_URL JAGOTA_NODEAPI_USERNAME JAGOTA_NODEAPI_PASSWORD \
                     CRON_COMPETITOR_PRICES_REFRESH_ENABLED CRON_MARKETING_RESEARCH_ENABLED RESEARCH_FREE_WORKER_ENABLED SCRAPING_CRON_DISABLED \
                     AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY WINBACK_INTAKE_KEY; do
              if [ -n "${!v}" ]; then printf "%s='%s'\n" "$v" "${!v}"; fi
            done; } > .env.new && mv .env.new .env
          # Cutover flags: repo variable PLATFORM_FLAGS (KEY=VALUE lines, non-secret) → platform-flags.env (compose env_file).
          printf '%s\n' "$PLATFORM_FLAGS" | grep -E '^[A-Z][A-Z0-9_]*=[^ ]*$' > platform-flags.env || true
          if grep -Eiq '(SECRET|PASSWORD|TOKEN|_KEY|DATABASE_URL)=' platform-flags.env; then echo "::error::PLATFORM_FLAGS must not carry secrets"; exit 1; fi
          fi
          SVC_LIST=$(echo "$SERVICES" | tr -d '[]"' | tr ',' ' ')
          # The media key pair (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, josh bucket only) is for the container and is
          # already in ./.env. Keep it out of this shell: the ECR credential helper would use it instead of the instance
          # role and the pull fails ("no basic auth credentials"). Compose still reads the keys from ./.env.
          DEPLOY_ARGS=("$TAG")
          if [[ "$SKIP_CLEANUP" == 'true' ]]; then DEPLOY_ARGS+=(--skip-cleanup); fi
          read -r -a SERVICE_ARGS <<< "$SVC_LIST"
          DEPLOY_ARGS+=("${SERVICE_ARGS[@]}")
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY ./ec2-deploy.sh "${DEPLOY_ARGS[@]}"
      - name: Verify migrated schema, sibling images and anonymous API availability
        if: contains(fromJson(needs.resolve.outputs.services), 'platform')
        env:
          DEPLOY_DIR: ${{ secrets.EC2_DEPLOY_DIR }}
          MIGRATION_SCOPE_COMMIT: ${{ needs.resolve.outputs.application_commit }}
          MIGRATION_SCOPE_IMAGE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          D="$DEPLOY_DIR/docker"
          bash docker/platform-migration-scope.sh preflight "$D"
          cd "$D"
          for svc in platform admin portal; do
            id="$(docker compose -f docker-compose.prod.yml ps -q "$svc")"
            docker inspect -f '{{.Name}} {{.Config.Image}} {{.Image}}' "$id"
            [[ "$svc" != platform ]] || platform_id="$id"
          done
          docker exec -i "$platform_id" node - < platform-api-availability.cjs
