# Commerce Platform prod stack — pulled from ECR, run directly on EC2 (no Fargate/ECS).
# Same pattern as the josh monorepo's docker/docker-compose.yml + ec2-deploy.sh.
#
# Networking: this compose does NOT include nginx/TLS — domain routing (commerce.joshapp.io,
# commerce-admin.joshapp.io, ...) is an infra decision to make when DNS/certs are set up.
# For now each service publishes its port directly on the host.

services:
  platform:
    image: ${ECR_REGISTRY}/commerce-platform:${PLATFORM_TAG:-latest}
    restart: unless-stopped
    ports:
      - '3100:3100'
    environment:
      NODE_ENV: production
      PORT: 3100
      COMMERCE_DB_HOST: ${COMMERCE_DB_HOST}
      COMMERCE_DB_PORT: ${COMMERCE_DB_PORT:-5432}
      COMMERCE_DB_USERNAME: ${COMMERCE_DB_USERNAME}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD}
      COMMERCE_DB_NAME: ${COMMERCE_DB_NAME:-commerce_db}
      COMMERCE_DB_SSL: ${COMMERCE_DB_SSL:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # Chromium on an 8 GB box: 1 long scheduled session + 1 slot for admin previews/link crawls (~0.5-1.5 GB each).
      SCRAPING_MAX_BROWSER_SESSIONS: ${SCRAPING_MAX_BROWSER_SESSIONS:-1}
      SCRAPING_MAX_BROWSERS: ${SCRAPING_MAX_BROWSERS:-2}
      STOREFRONT_API_KEYS: ${STOREFRONT_API_KEYS}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET}
      COMMERCE_CORS_ORIGINS: ${COMMERCE_CORS_ORIGINS}
      # josh's databases, READ-ONLY users (scripts/josh-db-readonly-users.sh). Unset = josh pages show "not configured".
      JOSH_DATABASE_URL: ${JOSH_DATABASE_URL:-}
      JOSH_MONGO_URL: ${JOSH_MONGO_URL:-}

    depends_on:
      - redis

  # BullMQ queues. Internal only (no published port); BullMQ requires noeviction.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '512mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data

  admin:
    image: ${ECR_REGISTRY}/commerce-admin:${ADMIN_TAG:-latest}
    restart: unless-stopped
    ports:
      - '4403:80'
    depends_on:
      - platform

  portal:
    image: ${ECR_REGISTRY}/commerce-portal:${PORTAL_TAG:-latest}
    restart: unless-stopped
    ports:
      - '4404:80'
    depends_on:
      - platform

volumes:
  redis_data:
