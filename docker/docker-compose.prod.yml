# Commerce Platform prod stack — pulled from ECR, run directly on EC2 (no Fargate/ECS).
# Same pattern as the josh monorepo's docker/docker-compose.yml + ec2-deploy.sh.
#
# Networking: nginx (80/443) is the public edge for commerce.joshapp.io → admin + /api, /mcp → platform.
# platform:3100 stays published for josh's servers (SG: 3100 from josh only); admin/portal ports are
# for SSM port-forwarding. First TLS cert: ./ssl-init.sh.

services:
  platform:
    image: ${ECR_REGISTRY}/commerce-platform:${PLATFORM_TAG:-latest}
    restart: unless-stopped
    ports:
      - '3100:3100'
    # Resolve joshapp.io to josh private IP so JOSH_API_URL=https://joshapp.io/api
    # stays TLS-valid but never hits Cloudflare (same VPC).
    extra_hosts:
      - 'joshapp.io:172.31.40.34'
    environment:
      NODE_ENV: production
      PORT: 3100
      COMMERCE_DB_HOST: ${COMMERCE_DB_HOST}
      COMMERCE_DB_PORT: ${COMMERCE_DB_PORT:-5432}
      COMMERCE_DB_USERNAME: ${COMMERCE_DB_USERNAME}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD}
      COMMERCE_DB_NAME: ${COMMERCE_DB_NAME:-commerce_db}
      COMMERCE_DB_SSL: ${COMMERCE_DB_SSL:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # Chromium on an 8 GB box: 1 long scheduled session + 1 slot for admin previews/link crawls (~0.5-1.5 GB each).
      SCRAPING_MAX_BROWSER_SESSIONS: ${SCRAPING_MAX_BROWSER_SESSIONS:-1}
      SCRAPING_MAX_BROWSERS: ${SCRAPING_MAX_BROWSERS:-2}
      STOREFRONT_API_KEYS: ${STOREFRONT_API_KEYS}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET}
      COMMERCE_CORS_ORIGINS: ${COMMERCE_CORS_ORIGINS}
      # josh's databases, READ-ONLY users (scripts/josh-db-readonly-users.sh). Unset = josh pages show "not configured".
      JOSH_DATABASE_URL: ${JOSH_DATABASE_URL:-}
      JOSH_MONGO_URL: ${JOSH_MONGO_URL:-}
      JOSH_MONGO_DB: ${JOSH_MONGO_DB:-}
      # Writes back to josh (offload results, actions); HMAC secret must equal josh's. Unset = off.
      JOSH_API_URL: ${JOSH_API_URL:-}
      JOSH_EVENTS_SECRET: ${JOSH_EVENTS_SECRET:-}
      JOSH_JWT_SECRET: ${JOSH_JWT_SECRET:-}
      # MCP server for AI clients; Cloudflare → nginx → app = 2 proxy hops for rate-limit client IPs.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://commerce.joshapp.io}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      # Josh → commerce → Jagota (JAGOTA_VIA_COMMERCE_BRANCHES on josh). Off unless ENABLED=true + NODEAPI_*.
      JAGOTA_GATEWAY_ENABLED: ${JAGOTA_GATEWAY_ENABLED:-false}
      JAGOTA_NODEAPI_BASE_URL: ${JAGOTA_NODEAPI_BASE_URL:-}
      JAGOTA_NODEAPI_USERNAME: ${JAGOTA_NODEAPI_USERNAME:-}
      JAGOTA_NODEAPI_PASSWORD: ${JAGOTA_NODEAPI_PASSWORD:-}

    depends_on:
      - redis

  # BullMQ queues. Internal only (no published port); BullMQ requires noeviction.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '512mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data

  admin:
    image: ${ECR_REGISTRY}/commerce-admin:${ADMIN_TAG:-latest}
    restart: unless-stopped
    ports:
      - '4403:80'
    depends_on:
      - platform

  portal:
    image: ${ECR_REGISTRY}/commerce-portal:${PORTAL_TAG:-latest}
    restart: unless-stopped
    ports:
      - '4404:80'
    depends_on:
      - platform

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/commerce-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Reload every 6h so renewed certs are served.
    command: ['/bin/sh', '-c', 'while :; do sleep 6h & wait $$!; nginx -s reload; done & exec nginx -g "daemon off;"']
    depends_on:
      - platform
      - admin

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renews only when <30 days left.
    entrypoint: ['/bin/sh', '-c', 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done']

volumes:
  redis_data:
