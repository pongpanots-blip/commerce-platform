# Public edge for commerce.joshapp.io (Cloudflare proxied → this nginx → containers).
# TLS: Let's Encrypt via certbot webroot, same as josh. First cert: docker/ssl-init.sh.
# Docker DNS + variables so a redeployed container's new IP is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name commerce.joshapp.io;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name commerce.joshapp.io;

  ssl_certificate /etc/letsencrypt/live/commerce.joshapp.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/commerce.joshapp.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 20m;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 120s;

  set $platform http://platform:3100;
  set $admin http://admin:80;

  # API, MCP endpoint and the MCP OAuth endpoints (mounted at the issuer root by the MCP SDK).
  location ~ ^/(api|mcp)(/|$) { proxy_pass $platform; }
  location ~ ^/(authorize|token|register|revoke)$ { proxy_pass $platform; }
  location ^~ /.well-known/oauth- { proxy_pass $platform; }

  location / { proxy_pass $admin; }
}
